<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크롬 공룡 게임 - 픽셀 & 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 800px;
            height: 400px;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #333;
            background: #f7f7f7;
        }

        #game3D {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            border: 2px solid #333;
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #fff;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #000;
            font-size: 14px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }

        .mode-toggle {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid #fff;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 5px;
        }

        .mode-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border: 3px solid #fff;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .restart-btn {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
        }

        .restart-btn:hover {
            background: #000;
            color: #fff;
        }

        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border: 3px solid #fff;
            text-align: center;
        }

        .start-screen h1 {
            font-size: 36px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .start-btn {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
        }

        .start-btn:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="game3D"></div>
        <button class="mode-toggle" id="modeToggle">3D 모드로 전환</button>
        <div class="ui-overlay">
            <div>HI: <span id="highScore">0</span></div>
            <div>점수: <span id="score">0</span></div>
        </div>
        <div class="controls">
            스페이스바: 점프 | P: 일시정지
        </div>
        <div class="start-screen" id="startScreen">
            <h1>공룡 게임</h1>
            <p>스페이스바를 눌러 시작하세요!</p>
            <button class="start-btn" onclick="startGame()">시작</button>
        </div>
        <div class="game-over" id="gameOver">
            <h2>게임 오버</h2>
            <p>점수: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">다시 시작</button>
        </div>
    </div>

    <script>
        // 게임 변수
        let canvas, ctx;
        let game3D, scene, camera, renderer, dino3D, obstacles3D = [];
        let is3DMode = false;
        let gameStarted = false;
        let isGameOver = false;
        let isPaused = false;
        let score = 0;
        let highScore = 0;
        let speed = 5;
        let gravity = 0.8;
        let jumpPower = -15;
        let velocity = 0;
        let isJumping = false;
        let groundY = 350;
        let dinoX = 50;
        let dinoY = groundY;
        let dinoWidth = 40;
        let dinoHeight = 40;
        let obstacles = [];
        let clouds = [];
        let animationId;
        let lastObstacleTime = 0;
        let obstacleInterval = 2000;
        let audioContext;
        let bgmOscillator;
        let bgmGainNode;
        let bgmPlaying = false;

        // 초기화
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 400;

            // 픽셀 스타일 설정
            ctx.imageSmoothingEnabled = false;

            // 3D 초기화
            init3D();

            // 이벤트 리스너
            document.addEventListener('keydown', handleKeyDown);
            document.getElementById('modeToggle').addEventListener('click', toggleMode);

            // Web Audio API 초기화
            initAudio();

            // 게임 루프 시작
            gameLoop();
        }

        // Web Audio API로 배경 음악 생성
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.log('Web Audio API를 지원하지 않습니다.');
            }
        }

        function startBGM() {
            if (!audioContext || bgmPlaying) return;

            bgmGainNode = audioContext.createGain();
            bgmGainNode.connect(audioContext.destination);
            bgmGainNode.gain.value = 0.15; // 볼륨 조절

            // 8비트 스타일 멜로디 (크롬 공룡 게임 느낌)
            const melody = [
                { freq: 523.25, duration: 0.2 }, // C5
                { freq: 587.33, duration: 0.2 }, // D5
                { freq: 659.25, duration: 0.2 }, // E5
                { freq: 523.25, duration: 0.2 }, // C5
                { freq: 392.00, duration: 0.3 }, // G4
                { freq: 440.00, duration: 0.2 }, // A4
                { freq: 493.88, duration: 0.2 }, // B4
                { freq: 523.25, duration: 0.4 }, // C5
                { freq: 0, duration: 0.1 }, // 쉼표
            ];

            let noteIndex = 0;
            let startTime = audioContext.currentTime;

            function scheduleNotes() {
                if (!gameStarted || isGameOver || isPaused) {
                    bgmPlaying = false;
                    return;
                }

                const currentTime = audioContext.currentTime;
                const note = melody[noteIndex];

                if (note.freq > 0) {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.type = 'square'; // 8비트 사운드
                    oscillator.frequency.value = note.freq;
                    
                    gainNode.gain.setValueAtTime(0, currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.15, currentTime + 0.01);
                    gainNode.gain.linearRampToValueAtTime(0, currentTime + note.duration);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(bgmGainNode);
                    
                    oscillator.start(currentTime);
                    oscillator.stop(currentTime + note.duration);
                }

                noteIndex = (noteIndex + 1) % melody.length;
                startTime += note.duration;

                // 다음 노트 스케줄링
                if (gameStarted && !isGameOver && !isPaused) {
                    setTimeout(scheduleNotes, note.duration * 1000);
                } else {
                    bgmPlaying = false;
                }
            }

            bgmPlaying = true;
            scheduleNotes();
        }

        function stopBGM() {
            if (bgmGainNode) {
                bgmGainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            }
            bgmPlaying = false;
        }

        // 3D 초기화
        function init3D() {
            const container = document.getElementById('game3D');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf7f7f7);

            camera = new THREE.PerspectiveCamera(75, 800 / 400, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(800, 400);
            container.appendChild(renderer.domElement);

            // 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // 바닥
            const groundGeometry = new THREE.PlaneGeometry(100, 10);
            const groundMaterial = new THREE.MeshBasicMaterial({ color: 0x87ceeb });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -2;
            scene.add(ground);

            // 공룡 3D
            const dinoGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const dinoMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });
            dino3D = new THREE.Mesh(dinoGeometry, dinoMaterial);
            dino3D.position.set(-3, -1.5, 0);
            scene.add(dino3D);
        }

        // 모드 전환
        function toggleMode() {
            is3DMode = !is3DMode;
            const canvas = document.getElementById('gameCanvas');
            const container3D = document.getElementById('game3D');
            const toggleBtn = document.getElementById('modeToggle');

            if (is3DMode) {
                canvas.style.display = 'none';
                container3D.style.display = 'block';
                toggleBtn.textContent = '2D 모드로 전환';
                // 기존 장애물을 3D로 동기화
                if (gameStarted) {
                    syncObstaclesTo3D();
                }
            } else {
                canvas.style.display = 'block';
                container3D.style.display = 'none';
                toggleBtn.textContent = '3D 모드로 전환';
            }
        }

        // 키 입력 처리
        function handleKeyDown(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameStarted) {
                    startGame();
                } else if (!isJumping && !isGameOver && !isPaused) {
                    jump();
                } else if (isGameOver) {
                    restartGame();
                }
            }
            if (e.code === 'KeyP' && gameStarted && !isGameOver) {
                isPaused = !isPaused;
                if (!isPaused) {
                    if (audioContext && !bgmPlaying) {
                        startBGM();
                    }
                    gameLoop();
                } else {
                    if (bgmPlaying) {
                        stopBGM();
                    }
                }
            }
        }

        // 게임 시작
        function startGame() {
            gameStarted = true;
            isGameOver = false;
            isPaused = false;
            score = 0;
            speed = 5;
            velocity = 0;
            isJumping = false;
            dinoY = groundY;
            obstacles = [];
            obstacles3D = [];
            clouds = [];
            lastObstacleTime = 0;

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';

            // BGM 시작
            if (audioContext) {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                if (!bgmPlaying) {
                    startBGM();
                }
            }

            gameLoop();
        }

        // 점프
        function jump() {
            if (isJumping) return;
            isJumping = true;
            velocity = jumpPower;
        }

        // 장애물 생성
        function createObstacle() {
            const now = Date.now();
            if (now - lastObstacleTime < obstacleInterval) return;
            lastObstacleTime = now;

            const obstacle = {
                x: 800,
                y: groundY,
                width: 20,
                height: 40 + Math.random() * 20
            };
            obstacles.push(obstacle);

            // 3D 장애물 생성 (3D 모드일 때만)
            if (is3DMode && scene) {
                const obstacleGeometry = new THREE.BoxGeometry(0.3, obstacle.height / 50, 0.3);
                const obstacleMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const obstacle3D = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
                obstacle3D.position.set(obstacle.x / 50 - 4, -2 + obstacle.height / 100, 0);
                obstacle3D.userData.obstacle = obstacle;
                scene.add(obstacle3D);
                obstacles3D.push(obstacle3D);
            }
        }

        // 기존 장애물을 3D로 변환
        function syncObstaclesTo3D() {
            if (!is3DMode || !scene) return;
            
            // 기존 3D 장애물 제거
            obstacles3D.forEach(obj => scene.remove(obj));
            obstacles3D = [];
            
            // 현재 장애물들을 3D로 변환
            obstacles.forEach(obstacle => {
                const obstacleGeometry = new THREE.BoxGeometry(0.3, obstacle.height / 50, 0.3);
                const obstacleMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const obstacle3D = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
                obstacle3D.position.set(obstacle.x / 50 - 4, -2 + obstacle.height / 100, 0);
                obstacle3D.userData.obstacle = obstacle;
                scene.add(obstacle3D);
                obstacles3D.push(obstacle3D);
            });
        }

        // 구름 생성
        function createCloud() {
            if (Math.random() > 0.01) return;
            clouds.push({
                x: 800,
                y: 50 + Math.random() * 100,
                width: 60 + Math.random() * 40,
                height: 30
            });
        }

        // 충돌 감지
        function checkCollision(obstacle) {
            return dinoX < obstacle.x + obstacle.width &&
                   dinoX + dinoWidth > obstacle.x &&
                   dinoY < obstacle.y + obstacle.height &&
                   dinoY + dinoHeight > obstacle.y;
        }

        // 게임 오버
        function gameOver() {
            isGameOver = true;
            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('gameOver').style.display = 'block';
            cancelAnimationFrame(animationId);
            stopBGM();
        }

        // 게임 재시작
        function restartGame() {
            startGame();
        }

        // 2D 렌더링
        function render2D() {
            // 배경 지우기
            ctx.fillStyle = '#f7f7f7';
            ctx.fillRect(0, 0, 800, 400);

            // 바닥
            ctx.fillStyle = '#535353';
            ctx.fillRect(0, groundY, 800, 400 - groundY);

            // 구름
            ctx.fillStyle = '#ffffff';
            clouds.forEach(cloud => {
                ctx.fillRect(cloud.x, cloud.y, cloud.width, cloud.height);
                ctx.fillRect(cloud.x + 10, cloud.y - 5, cloud.width - 20, cloud.height);
            });

            // 장애물 (선인장)
            ctx.fillStyle = '#00ff00';
            obstacles.forEach(obstacle => {
                ctx.fillRect(obstacle.x, obstacle.y - obstacle.height, obstacle.width, obstacle.height);
                // 선인장 가지
                ctx.fillRect(obstacle.x - 5, obstacle.y - obstacle.height + 10, 10, 5);
                ctx.fillRect(obstacle.x + obstacle.width - 5, obstacle.y - obstacle.height + 20, 10, 5);
            });

            // 공룡 (픽셀 스타일)
            ctx.fillStyle = '#000000';
            ctx.fillRect(dinoX, dinoY - dinoHeight, dinoWidth, dinoHeight);
            // 공룡 눈
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(dinoX + 10, dinoY - dinoHeight + 10, 5, 5);
            ctx.fillRect(dinoX + 25, dinoY - dinoHeight + 10, 5, 5);
            // 공룡 다리
            ctx.fillStyle = '#000000';
            if (!isJumping) {
                ctx.fillRect(dinoX + 5, dinoY, 8, 5);
                ctx.fillRect(dinoX + 27, dinoY, 8, 5);
            }
        }

            // 3D 렌더링
        function render3D() {
            if (!scene || !renderer) return;
            
            // 공룡 위치 업데이트
            dino3D.position.y = -2 + (groundY - dinoY) / 50;

            // 장애물 업데이트
            obstacles3D.forEach((obstacle3D, index) => {
                const obstacle = obstacle3D.userData.obstacle;
                if (obstacle) {
                    obstacle.x -= speed;
                    obstacle3D.position.x = obstacle.x / 50 - 4;

                    if (obstacle.x < -50) {
                        scene.remove(obstacle3D);
                        obstacles3D.splice(index, 1);
                        const obstacleIndex = obstacles.indexOf(obstacle);
                        if (obstacleIndex > -1) {
                            obstacles.splice(obstacleIndex, 1);
                        }
                    }
                }
            });

            renderer.render(scene, camera);
        }

        // 메인 게임 루프
        function gameLoop() {
            if (isPaused || isGameOver) return;

            // 점수 증가
            score += 0.1;
            document.getElementById('score').textContent = Math.floor(score);
            if (score > highScore) {
                highScore = Math.floor(score);
                document.getElementById('highScore').textContent = highScore;
            }

            // 속도 증가
            speed = 5 + Math.floor(score / 100) * 0.5;
            obstacleInterval = Math.max(1000, 2000 - Math.floor(score / 50) * 50);

            // 공룡 물리
            if (isJumping) {
                velocity += gravity;
                dinoY += velocity;
                if (dinoY >= groundY) {
                    dinoY = groundY;
                    velocity = 0;
                    isJumping = false;
                }
            }

            // 장애물 생성
            createObstacle();
            createCloud();

            // 장애물 이동 및 충돌 감지
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= speed;
                if (obstacle.x < -50) {
                    obstacles.splice(index, 1);
                } else if (!is3DMode && checkCollision(obstacle)) {
                    gameOver();
                }
            });

            // 3D 모드 충돌 감지
            if (is3DMode) {
                obstacles3D.forEach((obstacle3D, index) => {
                    const obstacle = obstacle3D.userData.obstacle;
                    if (obstacle) {
                        // 3D 공간에서 충돌 감지 (2D 좌표로 변환)
                        const dino3DX = (dinoX / 50) - 4;
                        const dino3DZ = 0;
                        const obstacle3DX = obstacle3D.position.x;
                        const obstacle3DZ = obstacle3D.position.z;
                        
                        const distance = Math.sqrt(
                            Math.pow(dino3DX - obstacle3DX, 2) + 
                            Math.pow(dino3DZ - obstacle3DZ, 2)
                        );
                        
                        if (distance < 0.6 && dino3D.position.y < obstacle3D.position.y + 0.3) {
                            gameOver();
                        }
                    }
                });
            }

            // 구름 이동
            clouds.forEach((cloud, index) => {
                cloud.x -= speed * 0.5;
                if (cloud.x < -100) {
                    clouds.splice(index, 1);
                }
            });

            // 렌더링
            if (is3DMode) {
                render3D();
            } else {
                render2D();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // 초기화 실행
        init();
    </script>
</body>
</html>
